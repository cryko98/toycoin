<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Toycoin banner 1500×500</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Inter+Tight:wght@600;800;900&family=JetBrains+Mono:wght@600;700&display=block" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1500px; height: 500px; overflow: hidden; background: #000; }
.banner { position: relative; width: 1500px; height: 500px; overflow: hidden; font-family: "Inter Tight", Arial, sans-serif; color: #FFF4E3; }
/* photo: right side, slightly zoomed so the kids fill it */
.photo { position: absolute; left: 430px; top: 0; width: 1070px; height: 500px; background: url(bg-2.jpg) 48% 62% / cover no-repeat; }
.photo::after { content: ""; position: absolute; inset: 0;
  background: radial-gradient(120% 100% at 60% 40%, transparent 55%, rgba(30,8,10,.45)), linear-gradient(180deg, rgba(0,0,0,.05), rgba(30,8,10,.25)); }
/* brand panel with a diagonal edge */
.panel { position: absolute; left: 0; top: 0; width: 640px; height: 500px; clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%);
  background: radial-gradient(90% 120% at 20% 30%, #C8333B 0%, #9C1F27 55%, #6E141A 100%); }
.panel::before { content: ""; position: absolute; inset: 0; opacity: .1; background: repeating-linear-gradient(135deg, #FFF4E3 0 2px, transparent 2px 34px); }
/* gold ribbon along the diagonal + bow */
.ribbon { position: absolute; left: 470px; top: -60px; width: 46px; height: 640px; transform: rotate(18.8deg); transform-origin: 50% 50%;
  background: linear-gradient(90deg, #A9781F, #F6D488 45%, #D9A441 70%, #A9781F); box-shadow: 0 0 30px rgba(0,0,0,.45); }
.bow { position: absolute; left: 464px; top: 2px; width: 190px; filter: drop-shadow(0 10px 14px rgba(0,0,0,.45)); }
/* content */
.logo { position: absolute; left: 56px; top: 54px; width: 118px; height: 118px; border-radius: 30px; overflow: hidden;
  box-shadow: 0 0 0 6px #D9A441, 0 0 0 9px #F6D488, 0 18px 30px -8px rgba(0,0,0,.6); }
.logo img { width: 100%; height: 100%; display: block; }
.name { position: absolute; left: 200px; top: 70px; font: 700 54px/1 "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1; letter-spacing: -.01em; }
.chain { position: absolute; left: 202px; top: 136px; font: 600 17px/1 "JetBrains Mono", monospace; letter-spacing: .14em; color: #F6D488; }
.blocks { position: absolute; left: 56px; top: 208px; display: flex; gap: 12px; }
.blk { width: 96px; height: 96px; border-radius: 15px; display: grid; place-items: center; position: relative;
  font: 900 64px/1 "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1;
  box-shadow: inset 0 -8px 0 rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.3), 0 18px 26px -10px rgba(0,0,0,.6); }
.blk::before { content: ""; position: absolute; inset: 8px; border-radius: 9px; border: 2.5px dashed rgba(255,255,255,.38); }
.c0 { background: #D9A441; color: #6E141A; transform: rotate(-5deg); } .c1 { background: #1F5A3D; color: #FFF4E3; transform: translateY(-8px) rotate(3deg); }
.c2 { background: #FFF4E3; color: #B3262E; transform: rotate(-2deg); } .c3 { background: #1E2F5C; color: #F6D488; transform: translateY(-4px) rotate(6deg); }
.tag { position: absolute; left: 58px; top: 338px; font: italic 600 34px/1 "Fraunces", serif; font-variation-settings: "SOFT" 100, "WONK" 1; color: #FFF4E3; }
.tag em { color: #F6D488; }
.chips { position: absolute; left: 56px; top: 404px; display: flex; gap: 10px; }
.chip { padding: 11px 16px; border-radius: 999px; font: 800 16px/1 "Inter Tight", sans-serif; white-space: nowrap; }
.chip.a { background: #FFF4E3; color: #9C1F27; } .chip.b { background: rgba(19,31,64,.75); color: #F6D488; box-shadow: inset 0 0 0 1.5px rgba(246,212,136,.4); }
/* atmosphere */
.glow { position: absolute; right: 120px; top: -140px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(246,212,136,.28), transparent 65%); }
canvas { position: absolute; inset: 0; }
.vig { position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(0,0,0,.35); }
</style>
</head>
<body>
<div class="banner">
  <div class="photo"></div>
  <div class="glow"></div>
  <div class="panel"></div>
  <div class="ribbon"></div>
  <svg class="bow" viewBox="-160 -110 320 200"><path d="M0 0C-50-90-150-80-140-20c8 40 90 30 140 20zM0 0c50-90 150-80 140-20-8 40-90 30-140 20z" fill="#D9A441" stroke="#9C6C1A" stroke-width="6"/><path d="M0 0l-40 80 22-6 18 20zM0 0l40 80-22-6-18 20z" fill="#B98522"/><circle r="26" fill="#F6D488" stroke="#9C6C1A" stroke-width="6"/></svg>

  <div class="logo"><img src="../assets/logo.jpg" alt="" /></div>
  <div class="name">Toycoin</div>
  <div class="chain">SOLANA · PUMP.FUN</div>
  <div class="blocks"><div class="blk c0">$</div><div class="blk c1">T</div><div class="blk c2">O</div><div class="blk c3">Y</div></div>
  <div class="tag">Every trade wraps a <em>gift.</em></div>
  <div class="chips"><span class="chip a">♥ 100% creator rewards → Toys for Tots</span></div>

  <canvas id="snow" width="1500" height="500"></canvas>
  <div class="vig"></div>
</div>
<script>
  // deterministic snow
  let seed = 7; const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const c = document.getElementById('snow').getContext('2d');
  for (let i = 0; i < 170; i++) {
    const x = r() * 1500, y = r() * 500, rad = r() * 2.4 + .6;
    c.globalAlpha = .25 + r() * .6; c.fillStyle = '#FFF4E3'; c.beginPath(); c.arc(x, y, rad, 0, 6.283); c.fill();
  }
  Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => (window.__ready = true));
</script>
</body>
</html>
